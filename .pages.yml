media:
  input: public/media
  output: /media

content:
  - name: blog
    label: Blog articles
    type: collection
    path: src/content/blog
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Article title
        type: string
        required: true
      - name: description
        label: Short introduction
        type: text
        required: true
      - name: date
        label: Publication date and time
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - label: a girl
              value: a girl
            - label: tech
              value: tech
            - label: media
              value: media
      - name: draft
        label: Draft
        type: boolean
      - name: bibliography
        label: Bibliography
        type: object
        list: true
        fields:
          - name: label
            label: Reference
            type: string
          - name: url
            label: URL
            type: string
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown
          switcher: true

settings:
  content:
    merge: false
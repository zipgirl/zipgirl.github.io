media:
  input: public/media
  output: /media
content:
  - name: blog
    label: Artículos del blog
    type: collection
    path: src/content/blog
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Título del artículo
        type: string
        required: true
      - name: description
        label: Bajada / resumen
        type: text
        required: true
      - name: date
        label: Fecha y hora de publicación
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: category
        label: Categoría
        type: select
        required: true
        options:
          values:
            - label: Una chica
              value: a girl
            - label: Tecnología
              value: tech
            - label: Cultura y medios
              value: media
      - name: draft
        label: Borrador (no publicar)
        type: boolean
      - name: bibliography
        label: Bibliografía y fuentes
        type: object
        list: true
        fields:
          - name: label
            label: Referencia
            type: string
          - name: url
            label: Enlace (URL)
            type: string
      - name: body
        label: Contenido del artículo
        type: rich-text
        options:
          format: markdown
          switcher: true
settings:
  content:
    merge: false